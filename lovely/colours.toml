[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "globals.lua"
pattern = """        RENTAL = HEX('b18f43'),"""
position = "after"
payload = """
NIC_INCOGNITO = HEX("d0d0d0"),
NIC_INVERT = HEX("2f2f2f"),
NIC_TETO = HEX("e15d73"),
NIC_PLANTS = HEX("33cc00"),
NIC_PHASES = HEX("5e9794"),
NIC_NECROBINDER = HEX("994866"),
NIC_SOUL = HEX("14f4af"),

"""
overwrite = true
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = """  return G.ARGS.LOC_COLOURS[_c] or _default or G.C.UI.TEXT_DARK"""
position = "before"
payload = """
G.ARGS.LOC_COLOURS['nic_incognito'] = G.C.NIC_INCOGNITO
G.ARGS.LOC_COLOURS['nic_teto'] = G.C.NIC_TETO
G.ARGS.LOC_COLOURS['nic_plants'] = G.C.NIC_PLANTS
G.ARGS.LOC_COLOURS['nic_phases'] = G.C.NIC_PHASES
G.ARGS.LOC_COLOURS['nic_necrobinder'] = G.C.NIC_NECROBINDER
G.ARGS.LOC_COLOURS['nic_soul'] = G.C.NIC_SOUL
"""
overwrite = true
match_indent = true